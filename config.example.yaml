# Copy to config.yaml and fill in. Secrets can also come from env vars:
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET, ANTHROPIC_API_KEY
enabled: true
data_dir: data

twitch:
  client_id: ""
  client_secret: ""

jobs:
  - keyword: gta 6             # used for titles/metadata and the title-search fallback
    category: Grand Theft Auto VI   # exact Twitch category name (avoids matching GTA V)
    window_days: 7             # how far back to look for clips
    max_candidates: 40         # clips sent to analysis
    languages: [en]            # empty list = any language
    # Only clips from these streamers are used (logins). Empty = any streamer (riskier).
    allowlist: []
    vod_scan: true             # also mine allow-listed streamers' VODs for chat spikes

scoring:
  weights: {popularity: 0.35, audio: 0.15, ai: 0.50}
  min_ai_score: 5              # 0-10; below this a clip is dropped

chat_spikes:
  bucket_seconds: 10
  baseline_buckets: 30         # rolling window for the "normal" chat level
  multiplier: 2.5              # spike = score >= multiplier * baseline
  min_score: 15
  lead_seconds: 20             # chat reacts late; start the clip this far before the peak
  tail_seconds: 10

claude:
  model: claude-opus-5-5
  effort: medium

whisper:
  model: small                 # tiny/base/small/medium/large-v3
  device: cpu
